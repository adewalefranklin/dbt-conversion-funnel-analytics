version: 2

models:

  - name: int_lead_opportunity
    description: >
      Enriched sales opportunity model at one row per opportunity.
      Multiple legitimate opportunities per Lead are preserved.

    columns:
      - name: opportunity_id
        data_tests:
          - unique
          - not_null

  - name: int_subscription_enriched
    description: >
      Subscription-level model enriched with Lead and Account context.
      Unmatched parent relationships are intentionally retained.

    columns:
      - name: subscription_id
        data_tests:
          - unique
          - not_null

  - name: int_delivery_enriched
    description: >
      Delivery-level model enriched with subscription, Lead and Account
      context while preserving orphaned delivery relationships.

    columns:
      - name: delivery_id
        data_tests:
          - unique
          - not_null

  - name: int_lead_funnel
    description: >
      One-row-per-Lead analytical model containing independent business
      flags used to construct the strict sequential conversion funnel.

    columns:
      - name: lead_id
        data_tests:
          - unique
          - not_null